project_id = "monicacare"
[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 200
[db]
port = 54322
major_version = 17
[db.seed]
enabled = false
[auth]
enabled = true
